[package]
name = "reflect-titan-common"
version = "0.1.0"
edition = "2021"
description = "Vendored Titan-Pathfinder integration-template TradingVenue contract, shared by every titan/<product> crate."

[dependencies]
# upstream Titan integration-template deps - the vendored TradingVenue trait
async-trait = "0.1"
thiserror = "1"
log = "0.4"
solana-pubkey = "2.2"
solana-account = "2.2"
solana-instruction = "2.2"
spl-token = { version = "7", features = ["no-entrypoint"] }
spl-token-2022 = { version = "^9", features = ["no-entrypoint"] }
spl-associated-token-account = "6"
