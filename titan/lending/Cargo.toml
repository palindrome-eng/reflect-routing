[package]
name = "reflect-titan-lending"
version = "0.1.0"
edition = "2021"
description = "Reflect lending strategy as a Titan TradingVenue, built on reflect-sdk."

[dependencies]
reflect-routing-core = { path = "../../core" }
reflect-titan-common = { path = "../common" }
reflect-sdk = { workspace = true }

# the vendored TradingVenue trait lives in reflect-titan-common; this crate
# only needs the account/instruction types its own reflect.rs touches.
async-trait = "0.1"
solana-program = ">=2.1.0, <2.3"
solana-pubkey = "2.2"
solana-account = "2.2"
solana-instruction = "2.2"

# parity.rs proves quote==execution atom-exact: the dumped mainnet programs
# (reflect_main and the venue programs it calls) run in LiteSVM over a mainnet
# snapshot of one lending strategy. See tests/fixtures/SOURCES.md.
[dev-dependencies]
litesvm = "=0.6.1"
solana-sdk = "2.2"
tokio = { version = "1", features = ["rt", "macros"] }

[dev-dependencies.reflect-titan-common]
path = "../common"
features = ["harness"]
