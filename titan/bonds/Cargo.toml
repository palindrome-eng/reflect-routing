[package]
name = "reflect-titan-bonds"
version = "0.1.0"
edition = "2021"
description = "Reflect bond basket strategy as a Titan TradingVenue, built on reflect-sdk."

[dependencies]
reflect-routing-core = { path = "../../core" }
reflect-titan-common = { path = "../common" }
reflect-sdk = { package = "reflect-core-sdk", git = "https://github.com/palindrome-eng/reflect-sdk", tag = "v0.14.0" }

# the vendored TradingVenue trait lives in reflect-titan-common; this crate
# only needs the account/instruction types its own reflect.rs touches.
async-trait = "0.1"
solana-program = ">=2.1.0, <2.3"
solana-pubkey = "2.2"
solana-account = "2.2"
solana-instruction = "2.2"

# parity.rs proves quote==execution atom-exact against a FORGED bond basket:
# the state is built by reflect-core's `bond_forge_dump_tests` (mollusk pins
# solana 2.1 and cannot link with these 2.2 adapters) and dumped to
# tests/fixtures/ together with the reflect_main.so that forged it.
[dev-dependencies]
litesvm = "=0.6.1"
solana-sdk = "2.2"
solana-program-pack = "2.2"
spl-token = { version = "7", features = ["no-entrypoint"] }
spl-associated-token-account = "6"
serde_json = "1"
base64 = "0.22"
bincode = "1.3"
tokio = { version = "1", features = ["rt", "macros"] }
