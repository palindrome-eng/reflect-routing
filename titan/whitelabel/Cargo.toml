[package]
name = "reflect-titan-whitelabel"
version = "0.1.0"
edition = "2021"
description = "Reflect whitelabel branded pair as a Titan TradingVenue, built on reflect-sdk."

[dependencies]
reflect-routing-core = { path = "../../core" }
reflect-titan-common = { path = "../common" }
reflect-sdk = { package = "reflect-core-sdk", git = "https://github.com/palindrome-eng/reflect-core-sdk.git", tag = "v0.11.0" }

# the vendored TradingVenue trait lives in reflect-titan-common; this crate
# only needs the account/instruction types its own reflect.rs touches.
async-trait = "0.1"
solana-program = ">=2.1.0, <2.3"
solana-pubkey = "2.2"
solana-account = "2.2"
solana-instruction = "2.2"

# parity.rs proves quote==execution atom-exact against hand-synthesized proxy
# state (ProxyState/Oracle are hand-buildable; no forge needed) executed
# against the LIVE mainnet proxy program .so, dumped via SOLANA_RPC_URL and
# committed as a fixture - the Kamino resolver pattern from
# titan/lending/tests/parity.rs. A missing fixture FAILS the test.
[dev-dependencies]
litesvm = "=0.6.1"
solana-sdk = "2.2"
solana-program-pack = "2.2"
spl-token = { version = "7", features = ["no-entrypoint"] }
spl-associated-token-account = "6"
bincode = "1.3"
tokio = { version = "1", features = ["rt", "macros"] }
