[package]
name = "reflect-titan-whitelabel"
version = "0.1.0"
edition = "2021"
description = "Reflect whitelabel branded pair as a Titan TradingVenue, built on reflect-sdk."

[dependencies]
reflect-routing-core = { path = "../../core" }
reflect-sdk = { package = "reflect-core-sdk", path = "../../../reflect-core-sdk" }

# upstream Titan integration-template deps - the vendored TradingVenue trait
async-trait = "0.1"
thiserror = "1"
log = "0.4"
solana-program = ">=2.1.0, <2.3"
solana-pubkey = "2.2"
solana-account = "2.2"
solana-instruction = "2.2"
spl-token = { version = "7", features = ["no-entrypoint"] }
spl-token-2022 = { version = "^9", features = ["no-entrypoint"] }
spl-associated-token-account = "6"

# parity.rs proves quote==execution atom-exact against hand-synthesized proxy
# state (ProxyState/Oracle are hand-buildable; no forge needed) executed
# against the LIVE mainnet proxy program .so, dumped via SOLANA_RPC_URL and
# cached (never committed) - the Kamino resolver pattern from
# titan/lending/tests/parity.rs. Tests skip cleanly when the .so is absent.
[dev-dependencies]
litesvm = "=0.6.1"
solana-sdk = "2.2"
solana-program-pack = "2.2"
solana-client = "2.2"
spl-token = { version = "7", features = ["no-entrypoint"] }
spl-associated-token-account = "6"
bincode = "1.3"
tokio = { version = "1", features = ["rt", "macros"] }
