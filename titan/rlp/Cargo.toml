[package]
name = "reflect-titan-rlp"
version = "0.1.0"
edition = "2021"
description = "Reflect rlp insurance pool as a Titan TradingVenue, built on reflect-sdk."

[dependencies]
reflect-routing-core = { path = "../../core" }
reflect-titan-common = { path = "../common" }
reflect-sdk = { package = "reflect-core-sdk", path = "../../../reflect-core-sdk" }

# the vendored TradingVenue trait lives in reflect-titan-common; this crate
# only needs the account/instruction types its own reflect.rs touches.
async-trait = "0.1"
solana-program = ">=2.1.0, <2.3"
solana-pubkey = "2.2"
solana-account = "2.2"
solana-instruction = "2.2"

# parity.rs proves quote==execution atom-exact against a REAL rlp program built
# from source (reflect-program-library/rlp) and initialized via its own admin
# instructions in LiteSVM - the devnet deployment is stale (Settings layout
# predates the current SDK) and rlp is not on mainnet, so there is nothing to
# dump. Tests skip cleanly when the built .so is absent.
[dev-dependencies]
litesvm = "=0.6.1"
solana-sdk = "2.2"
solana-program-pack = "2.2"
spl-token = { version = "7", features = ["no-entrypoint"] }
spl-associated-token-account = "6"
bincode = "1.3"
tokio = { version = "1", features = ["rt", "macros"] }
