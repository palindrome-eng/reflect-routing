[package]
name = "reflect-titan-rlp"
version = "0.1.0"
edition = "2021"
description = "Reflect rlp insurance pool as a Titan TradingVenue, built on reflect-sdk."

[dependencies]
reflect-routing-core = { path = "../../core" }
reflect-titan-common = { path = "../common" }
reflect-sdk = { package = "reflect-core-sdk", git = "https://github.com/palindrome-eng/reflect-core-sdk.git", tag = "v0.13.0" }

# the vendored TradingVenue trait lives in reflect-titan-common; this crate
# only needs the account/instruction types its own reflect.rs touches.
async-trait = "0.1"
solana-program = ">=2.1.0, <2.3"
solana-pubkey = "2.2"
solana-account = "2.2"
solana-instruction = "2.2"

# parity.rs proves quote==execution atom-exact against the DUMPED mainnet rlp
# program over a mainnet snapshot (deposit), and against the oracle-stacking
# build bootstrapped through its own admin instructions (deposit + swap). The
# fixtures are committed under tests/fixtures (SOURCES.md); a missing fixture
# FAILS the test.
[dev-dependencies]
# The parity and drift suites bootstrap a pool through the admin builders; the shipped
# library stays on the user-flow surface.
reflect-sdk = { package = "reflect-core-sdk", git = "https://github.com/palindrome-eng/reflect-core-sdk.git", tag = "v0.13.0", features = ["operator"] }
reflect-titan-common = { path = "../common", features = ["harness"] }
litesvm = "=0.6.1"
solana-sdk = "2.2"
tokio = { version = "1", features = ["rt", "macros"] }
