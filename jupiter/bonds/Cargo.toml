[package]
name = "reflect-jupiter-bonds"
version = "0.1.0"
edition = "2021"
description = "Reflect bond basket strategy as a Jupiter Amm, built on reflect-sdk."

[dependencies]
reflect-routing-core = { path = "../../core" }
reflect-jupiter-common = { path = "../common" }
reflect-sdk = { package = "reflect-core-sdk", git = "https://github.com/palindrome-eng/reflect-core-sdk.git" }
solana-sdk = "2.2"
anyhow = "1"

[dev-dependencies]
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["rt", "macros"] }
