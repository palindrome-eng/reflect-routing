[package]
name = "reflect-jupiter-rlp"
version = "0.1.0"
edition = "2021"
description = "Reflect rlp insurance pool as a Jupiter Amm, built on reflect-sdk."

[dependencies]
reflect-routing-core = { path = "../../core" }
reflect-sdk = { package = "reflect-core-sdk", path = "../../../reflect-core-sdk" }
solana-sdk = "2.2"
anyhow = "1"
ahash = "0.8"
# KeyedAccount.params carries the registered asset-mint set at listing time
# (Settings stores only a count, not the mints - see RlpVenue docs).
serde_json = "1"

# parity.rs asserts quote==sdk + the golden account-meta order, built
# in-process from hand-synthesized rlp state (no forge, no fixture file needed).
[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
