[package]
name = "reflect-jupiter-lending"
version = "0.1.0"
edition = "2021"
description = "Reflect lending strategy as a Jupiter Amm, built on reflect-sdk."

[dependencies]
reflect-routing-core = { path = "../../core" }
reflect-jupiter-common = { path = "../common" }
reflect-sdk = { package = "reflect-core-sdk", git = "https://github.com/palindrome-eng/reflect-sdk", tag = "v0.14.0" }
solana-sdk = "2.2"
anyhow = "1"

# parity.rs asserts quote==sdk + the golden account-meta order. Hermetic: it
# consumes the SAME committed forged fixture as the Titan suite
# (titan/lending/tests/fixtures/forged_reserve_save.json), so it runs fully
# offline. serde_json/base64 parse the fixture JSON shape.
[dev-dependencies]
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["rt", "macros"] }
