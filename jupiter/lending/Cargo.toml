[package]
name = "reflect-jupiter-lending"
version = "0.1.0"
edition = "2021"
description = "Reflect lending strategy as a Jupiter Amm, built on reflect-sdk."

[dependencies]
reflect-routing-core = { path = "../../core" }
reflect-jupiter-common = { path = "../common" }
reflect-sdk = { workspace = true }
solana-sdk = "2.2"
anyhow = "1"

# parity.rs asserts quote==sdk + the golden account-meta order. Hermetic: it
# consumes the SAME committed mainnet snapshot as the Titan suite
# (titan/lending/tests/fixtures/snapshots/lending.json), so it runs fully
# offline.
[dev-dependencies]
reflect-jupiter-common = { path = "../common", features = ["fixtures"] }
tokio = { version = "1", features = ["rt", "macros"] }
