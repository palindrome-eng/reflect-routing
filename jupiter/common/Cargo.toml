[package]
name = "reflect-jupiter-common"
version = "0.1.0"
edition = "2021"
description = "Vendored Jupiter Amm trait + Swap tag (jupiter-amm-interface v0.6.1 shape), shared by every jupiter/<product> crate."

[dependencies]
anyhow = "1"
ahash = "0.8"
solana-sdk = "2.2"
# KeyedAccount.params carries per-market listing config (e.g. rlp's injected
# asset-mint set, since Settings stores only a count - see reflect-jupiter-rlp).
serde_json = "1"
